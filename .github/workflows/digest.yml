name: Daily AI Digest

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC — off-peak, ready before you wake up
  workflow_dispatch:        # allow manual runs

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config, so it
      # is absent from the environment while third-party deps and untrusted feed
      # content are being processed. The push step below opts back in explicitly.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      # uv.lock pins the whole graph with hashes, so a compromised upstream
      # release cannot enter this job, which holds the Anthropic, Gmail, and
      # Cloudflare secrets. --locked fails if the lock has drifted from
      # pyproject.toml rather than silently resolving something new.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: uv run python digest.py

      # Deploys from docs/ on disk, so it does not depend on the commit below.
      # Ordered first to keep the git token out of the npm/wrangler steps.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler pages deploy docs/ --project-name ai-digest --branch main --commit-dirty=true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ docs/ seen_urls.json trending_history.json
          git diff --staged --quiet && exit 0
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          git push origin HEAD:main
