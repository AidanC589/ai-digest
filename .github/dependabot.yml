# Dependabot version updates. Complements the locks in uv.lock and
# package-lock.json: a new major arrives as a reviewable PR instead of
# silently entering the 03:00 UTC run.
#
# Note: this file controls *version* updates only. Security updates are a
# separate repo setting (Settings > Code security > Dependabot security
# updates) and fire on advisories regardless of the schedule below.
version: 2
updates:
  # uv, not pip. Dependabot regenerates uv.lock through uv itself, so an update
  # re-resolves the whole graph. The pip ecosystem edits a flat hashed
  # requirements file line by line, which produced locks that could not install
  # — it bumped pydantic-core past the version pydantic pins.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]

  # Keeps the SHA pins in digest.yml current — without this they stay frozen
  # forever, which trades one stale-dependency problem for another.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
